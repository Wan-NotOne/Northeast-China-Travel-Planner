<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northeast China Travel Planner</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf5ff;background:#0c1729}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,calc((100vw - 1050px)/2));background:linear-gradient(120deg,#172c49,#174f70)}h1{margin:8px 0}p,small{color:#b9cce0}.wrap{max-width:1050px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{background:#1c3c5a;color:white;border:1px solid #41607c;padding:10px 13px;border-radius:9px;cursor:pointer}button.active,.primary{background:#2478ad}.card{background:#14263e;border:1px solid #304963;border-radius:13px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:700}.item{padding:12px 0;border-top:1px solid #304963}.item:first-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}input,select{background:#102238;color:white;border:1px solid #55718d;border-radius:7px;padding:9px;max-width:100%;width:100%}label{display:block;margin:8px 0 5px}h2{font-size:21px}footer{text-align:center;padding:24px;color:#a5bdd3}
</style></head><body>
<header><small>❄️ NORTHEAST CHINA · TRAVEL WORKSPACE</small><h1>东北旅行规划工具</h1><div>哈尔滨 · 伊春 · 黑河 | 2027/02/22 – 03/02</div><p>18 人 · 9 天 8 晚 · 长者与轮椅友好规划</p></header>
<main class="wrap"><nav id="nav"></nav><div id="app"></div></main><footer>Local-first · 数据只保存在本浏览器 · 交通、景点及无障碍信息均需确认</footer>
<script>
const key='ne-trip-v1',dates=Array.from({length:9},(_,i)=>{const d=new Date(Date.UTC(2027,1,22+i));return d.toISOString().slice(0,10)});
const initial={notes:[],stays:[],expenses:[],attractions:[['哈尔滨','圣索菲亚教堂'],['哈尔滨','中华巴洛克历史文化街区'],['哈尔滨','中央大街'],['哈尔滨','冰雪大世界'],['哈尔滨','哈尔滨极地公园'],['伊春','金山鹿苑'],['伊春','五营国家森林公园'],['伊春','汤旺河林海奇石'],['黑河','黑龙江江畔／黑龙江公园'],['黑河','俄罗斯一日游（需核实签证与通关）']].map(([city,name])=>({city,name,status:'待规划',access:'待核实'})),checks:['确认冰雪大世界实际开放日期','核实轮椅通行与车辆上下车条件','核实伊春至黑河交通和冬季路况','确认俄罗斯一日游签证与通关政策','确认18人酒店房型与电梯'].map(text=>({text,done:false}))};
let data;try{data={...structuredClone(initial),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{data=structuredClone(initial)}
const save=()=>localStorage.setItem(key,JSON.stringify(data)),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs={dashboard:'概览',itinerary:'每日行程',attractions:'景点',stays:'住宿',budget:'预算',backup:'备选方案',data:'数据备份'};let current='dashboard';
function show(t){current=t;document.getElementById('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===t?'active':''}" onclick="show('${k}')">${v}</button>`).join('');render()}
function add(type,fields){const obj={};fields.forEach(f=>obj[f]=document.getElementById(type+'-'+f).value.trim());if(type==='expenses'){obj.amount=Number(obj.amount);if(!Number.isFinite(obj.amount)||obj.amount<0)return alert('金额无效')}if(!Object.values(obj).some(Boolean))return;data[type].push(obj);save();render()}
function remove(type,i){if(!confirm('确定删除？'))return;data[type].splice(i,1);save();render()}
function form(type,fields,labels,choices={}){return `<div class="grid">${fields.map((f,i)=>`<div><label>${labels[i]}</label>${choices[f]?`<select id="${type}-${f}">${choices[f].map(x=>`<option>${escape(x)}</option>`).join('')}</select>`:`<input id="${type}-${f}" ${f==='amount'?'type="number" min="0" step="0.01"':''} placeholder="${escape(labels[i])}">`}</div>`).join('')}</div><p><button class="primary" onclick='add(${JSON.stringify(type)},${JSON.stringify(fields)})'>＋ 添加</button></p>`}
function records(type,fn){return data[type].map((x,i)=>`<div class="item row"><div>${fn(x)}</div><button onclick="remove('${type}',${i})">删除</button></div>`).join('')||'<p>暂无记录</p>'}
function render(){const total=data.expenses.reduce((s,x)=>s+Number(x.amount||0),0),done=data.checks.filter(x=>x.done).length;let html='';
if(current==='dashboard')html=`<div class="grid"><div class="card"><small>旅行人数</small><div class="stat">18</div><small>3 位老人 · 3 位小孩</small></div><div class="card"><small>旅行天数</small><div class="stat">9 天</div><small>8 晚</small></div><div class="card"><small>预算记录 (CNY)</small><div class="stat">¥ ${total.toFixed(0)}</div></div><div class="card"><small>准备事项</small><div class="stat">${done}/${data.checks.length}</div></div></div><div class="card"><h2>出行前待办</h2>${data.checks.map((x,i)=>`<div class="item"><label><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="data.checks[${i}].done=this.checked;save();render()"> ${escape(x.text)}</label></div>`).join('')}</div><div class="card"><h2>路线状态</h2><p>哈尔滨 → 伊春 → 黑河为主方案；呼伦贝尔是备选路线。所有交通和住宿均尚待核实。</p></div>`;
if(current==='itinerary')html=`<h2>每日行程</h2><p>计划抵达 2 月 22 日，3 月 2 日返程；具体航班及交通待核实。</p><div class="card">${dates.map((d,i)=>`<div class="item"><h3>Day ${i+1} · ${d}</h3>${data.notes.filter(n=>n.date===d).map(n=>`<p>${escape(n.detail)}</p>`).join('')||'<small>尚未安排</small>'}</div>`).join('')}</div><div class="card"><h3>添加行程</h3>${form('notes',['date','detail'],['日期','景点／交通／备注'],{date:dates})}${records('notes',x=>`<b>${escape(x.date)}</b> ${escape(x.detail)}`)}</div>`;
if(current==='attractions')html=`<h2>景点清单</h2><p>冬季无障碍通行需逐个向景区核实。</p><div class="card">${data.attractions.map((a,i)=>`<div class="item row"><div><b>${escape(a.name)}</b><br><small>${escape(a.city)} · 无障碍：${escape(a.access)}</small></div><select style="max-width:145px" onchange="data.attractions[${i}].status=this.value;save()">${['待规划','想去','已确认','不去'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div>`;
if(current==='stays')html=`<h2>住宿规划</h2><p>优先确认电梯、无障碍卫生间及 18 人房间配置。</p><div class="card">${form('stays',['city','hotel','nights','note'],['城市','酒店','晚数','房型／无障碍备注'])}${records('stays',x=>`<b>${escape(x.city)} · ${escape(x.hotel)}</b><br><small>${escape(x.nights)} 晚 · ${escape(x.note)}</small>`)}</div>`;
if(current==='budget')html=`<h2>预算追踪</h2><p>费用以人民币记录，不代表已支付。</p><div class="card">${form('expenses',['category','description','amount'],['类别','项目','金额 (CNY)'],{category:['交通','住宿','餐饮','门票','其他']})}${records('expenses',x=>`<b>${escape(x.category)} · ${escape(x.description)}</b><br>¥ ${Number(x.amount).toFixed(2)}`)}<h3>合计：¥ ${total.toFixed(2)}</h3></div>`;
if(current==='backup')html=`<h2>备用方案</h2>${[['冰雪大世界未开放','考虑哈尔滨极地公园、中央大街及室内活动；营业时间需核实'],['冬季交通受阻','为伊春和黑河交通预留机动时间，核实包车、路况和休息站'],['俄罗斯一日游无法成行','改为黑河市内活动，出发前确认跨境政策'],['替代路线','呼伦贝尔暂作为备选方向']].map(([a,b])=>`<div class="card"><h3>${a}</h3><p>${b}</p></div>`).join('')}`;
if(current==='data')html=`<h2>数据备份</h2><div class="card"><p>数据仅保存在本设备的浏览器中。请定期导出备份；上传到 GitHub 不会同步私人行程数据。</p><button class="primary" onclick="exportData()">导出 JSON</button><label>导入 JSON</label><input type="file" accept="application/json" onchange="importData(this.files[0])"></div>`;
document.getElementById('app').innerHTML=html}
function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='northeast-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(file){if(!file)return;try{const x=JSON.parse(await file.text());if(!['notes','stays','expenses','attractions','checks'].every(k=>Array.isArray(x[k])))throw Error();if(!confirm('覆盖现有数据？'))return;data=x;save();render()}catch{alert('JSON 格式不正确')}}
show('dashboard');
</script></body></html>
