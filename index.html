<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northeast China Travel Planner</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf5ff;background:#0c1729}*{box-sizing:border-box}body{margin:0}header{padding:28px max(20px,calc((100vw - 1050px)/2));background:linear-gradient(120deg,#172c49,#174f70)}h1{margin:8px 0}p,small{color:#b9cce0}.wrap{max-width:1050px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{background:#1c3c5a;color:white;border:1px solid #41607c;padding:10px 13px;border-radius:9px;cursor:pointer}button.active,.primary{background:#2478ad}.card{background:#14263e;border:1px solid #304963;border-radius:13px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:700}.item{padding:12px 0;border-top:1px solid #304963}.item:first-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}input,select{background:#102238;color:white;border:1px solid #55718d;border-radius:7px;padding:9px;max-width:100%;width:100%}label{display:block;margin:8px 0 5px}h2{font-size:21px}footer{text-align:center;padding:24px;color:#a5bdd3}
</style></head><body>
<header><small>❄️ NORTHEAST CHINA · TRAVEL WORKSPACE</small><h1>东北旅行规划工具</h1><div>哈尔滨 · 漠河 | 2027/02/22 – 03/02</div><p>18 人 · 9 天 8 晚 · 长者与轮椅友好规划</p></header>
<main class="wrap"><nav id="nav"></nav><div id="app"></div></main><footer>Local-first · 数据只保存在本浏览器 · 交通、景点及无障碍信息均需确认</footer>
<script>
const key='ne-trip-v1',dates=Array.from({length:9},(_,i)=>{const d=new Date(Date.UTC(2027,1,22+i));return d.toISOString().slice(0,10)});
const initial={notes:[],stays:[],expenses:[],rooms:[{name:'Family Room 1',guests:['Eu','Siew Li','Yu Hung']},{name:'Family Room 2',guests:['Lily','Feng Yuen','Feng Jie']},{name:'King Size Bed 1',guests:['Kam Weng','Siew Ling']},{name:'Double Bed 1',guests:['Zi Ying','Jia Wei']},{name:'Double Bed 2',guests:['Zi Xuan','Siew Cheng']},{name:'Double Bed 3',guests:['Ah Leek','Jia Yee']},{name:'Double Bed 4',guests:['Sheng','Boon Hock']}],attractions:[['哈尔滨','圣索菲亚教堂'],['哈尔滨','中华巴洛克历史文化街区'],['哈尔滨','中央大街'],['哈尔滨','冰雪大世界（如开放）'],['哈尔滨','哈尔滨极地公园（备用）'],['漠河','北极村'],['漠河','北红村'],['漠河','龙江第一湾'],['漠河','白桦林'],['漠河','最北邮局']].map(([city,name])=>({city,name,status:'待规划',access:'待核实'})),checks:['国际机票：已购买（不需重复预订）','确认漠河交通及18人团体座位','确认老人及两辆折叠轮椅接驳安排','确认冰雪大世界实际开放日期','核实漠河景区冬季路况与开放情况','预订酒店：待确定地点及房型'].map((text,i)=>({text,done:i===0}))};
let data;try{data={...structuredClone(initial),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{data=structuredClone(initial)}
if(!Array.isArray(data.rooms))data.rooms=structuredClone(initial.rooms); const save=()=>localStorage.setItem(key,JSON.stringify(data)),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs={dashboard:'概览',itinerary:'每日行程',attractions:'景点',rooms:'房间分配',stays:'住宿',budget:'预算',backup:'备选方案',data:'数据备份'};let current='dashboard';
function show(t){current=t;document.getElementById('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===t?'active':''}" onclick="show('${k}')">${v}</button>`).join('');render()}
function add(type,fields){const obj={};fields.forEach(f=>obj[f]=document.getElementById(type+'-'+f).value.trim());if(type==='expenses'){obj.amount=Number(obj.amount);if(!Number.isFinite(obj.amount)||obj.amount<0)return alert('金额无效')}if(!Object.values(obj).some(Boolean))return;data[type].push(obj);save();render()}
function remove(type,i){if(!confirm('确定删除？'))return;data[type].splice(i,1);save();render()}
function form(type,fields,labels,choices={}){return `<div class="grid">${fields.map((f,i)=>`<div><label>${labels[i]}</label>${choices[f]?`<select id="${type}-${f}">${choices[f].map(x=>`<option>${escape(x)}</option>`).join('')}</select>`:`<input id="${type}-${f}" ${f==='amount'?'type="number" min="0" step="0.01"':''} placeholder="${escape(labels[i])}">`}</div>`).join('')}</div><p><button class="primary" onclick='add(${JSON.stringify(type)},${JSON.stringify(fields)})'>＋ 添加</button></p>`}
function records(type,fn){return data[type].map((x,i)=>`<div class="item row"><div>${fn(x)}</div><button onclick="remove('${type}',${i})">删除</button></div>`).join('')||'<p>暂无记录</p>'}
function render(){const total=data.expenses.reduce((s,x)=>s+Number(x.amount||0),0),done=data.checks.filter(x=>x.done).length;let html='';
if(current==='dashboard')html=`<div class="grid"><div class="card"><small>旅行人数</small><div class="stat">18</div><small>3 位老人 · 3 位小孩</small></div><div class="card"><small>旅行天数</small><div class="stat">9 天</div><small>8 晚</small></div><div class="card"><small>预算记录 (CNY)</small><div class="stat">¥ ${total.toFixed(0)}</div></div><div class="card"><small>准备事项</small><div class="stat">${done}/${data.checks.length}</div></div></div><div class="card"><h2>出行前待办</h2>${data.checks.map((x,i)=>`<div class="item"><label><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="data.checks[${i}].done=this.checked;save();render()"> ${escape(x.text)}</label></div>`).join('')}</div><div class="card"><h2>路线状态</h2><p>方案 A：哈尔滨 → 漠河 → 哈尔滨。国际机票已购买；酒店及中国境内交通待订。2 位老人使用轮椅，但可以短距离行走及自行上下车。</p></div>`;
if(current==='itinerary')html=`<h2>每日行程</h2><p>2月22日07:05出发、约17:00抵达哈尔滨；3月2日18:05从哈尔滨返程、次日约06:00抵达马来西亚。国际机票已购买。漠河部分暂不排死车次。</p><div class="card">${dates.map((d,i)=>`<div class="item"><h3>Day ${i+1} · ${d}</h3>${data.notes.filter(n=>n.date===d).map(n=>`<p>${escape(n.detail)}</p>`).join('')||'<small>尚未安排</small>'}</div>`).join('')}</div><div class="card"><h3>添加行程</h3>${form('notes',['date','detail'],['日期','景点／交通／备注'],{date:dates})}${records('notes',x=>`<b>${escape(x.date)}</b> ${escape(x.detail)}`)}</div>`;
if(current==='attractions')html=`<h2>景点清单</h2><p>冬季无障碍通行需逐个向景区核实。</p><div class="card">${data.attractions.map((a,i)=>`<div class="item row"><div><b>${escape(a.name)}</b><br><small>${escape(a.city)} · 无障碍：${escape(a.access)}</small></div><select style="max-width:145px" onchange="data.attractions[${i}].status=this.value;save()">${['待规划','想去','已确认','不去'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div>`;
if(current==='rooms')html=`<h2>房间分配 · 7间 / 18人</h2><p>仅显示去姓氏的名字，不保存或展示身份证号码。酒店尚未预订；以下是拟定房型，最终以酒店确认床型和入住人数为准。</p><div class="grid">${data.rooms.map((r,i)=>`<div class="card"><div class="row"><h3>${escape(r.name)}</h3><small>${r.guests.length}人</small></div><div>${r.guests.map(x=>`<div class="item">${escape(x)}</div>`).join('')}</div></div>`).join('')}</div><p><small>家庭房须确认允许3人入住；King Size Bed房间2人；Double Bed为原图房型标签，不代表酒店已接受床型配置。</small></p>`;
if(current==='stays')html=`<h2>住宿规划</h2><p>酒店尚未预订；目前拟定7间房（2家庭房、1大床房、4双人房），实际房型需要酒店确认。优先确认电梯、无障碍入口、防滑浴室及供暖。</p><div class="card">${form('stays',['city','hotel','nights','note'],['城市','酒店','晚数','房型／无障碍备注'])}${records('stays',x=>`<b>${escape(x.city)} · ${escape(x.hotel)}</b><br><small>${escape(x.nights)} 晚 · ${escape(x.note)}</small>`)}</div>`;
if(current==='budget')html=`<h2>预算追踪</h2><p>费用以人民币记录，不代表已支付。</p><div class="card">${form('expenses',['category','description','amount'],['类别','项目','金额 (CNY)'],{category:['交通','住宿','餐饮','门票','其他']})}${records('expenses',x=>`<b>${escape(x.category)} · ${escape(x.description)}</b><br>¥ ${Number(x.amount).toFixed(2)}`)}<h3>合计：¥ ${total.toFixed(2)}</h3></div>`;
if(current==='backup')html=`<h2>备用方案</h2>${[['冰雪大世界未开放','改为哈尔滨极地公园，或选择室内场馆；开放时间及无障碍通道需核实'],['漠河航班或火车调整','保留哈尔滨返程前至少1晚，确认可选班次、取消政策及包车接驳'],['漠河极寒或道路封闭','取消龙江第一湾等偏远点，改为北极村内短程活动、室内休息或留在哈尔滨'],['轮椅及儿童适应困难','减少户外停留；优先有暖气和卫生间的景点，随时回车上休息']].map(([a,b])=>`<div class="card"><h3>${a}</h3><p>${b}</p></div>`).join('')}`;
if(current==='data')html=`<h2>数据备份</h2><div class="card"><p>行程与房间分配模板写在公开网页中（只有去姓氏的名字，没有身份证号码）；后续在浏览器修改的记录只存在本设备。请定期导出备份；上传到 GitHub 不会同步私人行程数据。</p><button class="primary" onclick="exportData()">导出 JSON</button><label>导入 JSON</label><input type="file" accept="application/json" onchange="importData(this.files[0])"></div>`;
document.getElementById('app').innerHTML=html}
function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='northeast-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(file){if(!file)return;try{const x=JSON.parse(await file.text());if(!['notes','stays','expenses','attractions','checks'].every(k=>Array.isArray(x[k])))throw Error();if(!Array.isArray(x.rooms))x.rooms=structuredClone(initial.rooms);if(!confirm('覆盖现有数据？'))return;data=x;save();render()}catch{alert('JSON 格式不正确')}}
show('dashboard');
</script></body></html>
